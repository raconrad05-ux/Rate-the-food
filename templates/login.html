{% extends "base.html" %}

{% block title %}Log in – Rate the Food{% endblock %}

{% block content %}
<section class="form-box">
  <h1>Log in</h1>
  {# Keep ?next=... in the form's URL so it's still there when the form is posted #}
  <form method="post" action="{{ url_for('login', next=next_url) if next_url else url_for('login') }}">
    <label>
      Username
      <input name="username" value="{{ username }}" required autocomplete="username">
    </label>
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
